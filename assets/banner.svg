<svg width="1500" height="500" viewBox="0 0 1500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0710"/>
      <stop offset="55%" stop-color="#0D0B16"/>
      <stop offset="100%" stop-color="#0A0710"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="signatureLine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="45%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#D8B4FE"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#D8B4FE"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <circle cx="260" cy="200" r="260" fill="url(#glowLeft)"/>
  <circle cx="1260" cy="300" r="280" fill="url(#glowRight)"/>

  <!-- scattered stars -->
  <g fill="#EDE9FE" opacity="0.55">
    <circle cx="90" cy="70" r="1.6"/>
    <circle cx="150" cy="140" r="1.1"/>
    <circle cx="1340" cy="90" r="1.6"/>
    <circle cx="1400" cy="160" r="1.2"/>
    <circle cx="70" cy="410" r="1.3"/>
    <circle cx="1420" cy="420" r="1.4"/>
    <circle cx="1180" cy="60" r="1.1"/>
    <circle cx="320" cy="440" r="1.2"/>
  </g>

  <!-- LEFT: neural network nodes, faint -->
  <g stroke="#8B5CF6" stroke-opacity="0.35" stroke-width="1">
    <line x1="70" y1="150" x2="150" y2="110"/>
    <line x1="70" y1="150" x2="150" y2="190"/>
    <line x1="150" y1="110" x2="230" y2="150"/>
    <line x1="150" y1="190" x2="230" y2="150"/>
    <line x1="150" y1="110" x2="230" y2="80"/>
    <line x1="150" y1="190" x2="230" y2="240"/>
    <line x1="230" y1="150" x2="300" y2="150"/>
    <line x1="230" y1="80" x2="300" y2="150"/>
    <line x1="230" y1="240" x2="300" y2="150"/>
  </g>
  <g fill="#C4B5FD" opacity="0.85">
    <circle cx="70" cy="150" r="3.5"/>
    <circle cx="150" cy="110" r="3"/>
    <circle cx="150" cy="190" r="3"/>
    <circle cx="230" cy="80" r="2.6"/>
    <circle cx="230" cy="150" r="3"/>
    <circle cx="230" cy="240" r="2.6"/>
    <circle cx="300" cy="150" r="4"/>
  </g>

  <!-- RIGHT: rising market chart, faint -->
  <g stroke="#A855F7" stroke-opacity="0.4" stroke-width="1.5" fill="none">
    <polyline points="1180,300 1220,280 1250,290 1290,240 1330,255 1370,200 1410,215 1440,160"/>
  </g>
  <g stroke="#7C3AED" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round">
    <line x1="1200" y1="270" x2="1200" y2="300"/>
    <line x1="1240" y1="260" x2="1240" y2="285"/>
    <line x1="1280" y1="230" x2="1280" y2="255"/>
    <line x1="1320" y1="245" x2="1320" y2="270"/>
    <line x1="1360" y1="190" x2="1360" y2="215"/>
    <line x1="1400" y1="205" x2="1400" y2="225"/>
  </g>

  <!-- SIGNATURE: one continuous line, network on the left melting into the chart's ascent on the right -->
  <path d="M 300 150 C 500 150, 550 320, 750 300 C 950 280, 1000 120, 1180 130"
        fill="none" stroke="url(#signatureLine)" stroke-width="2.5" opacity="0.75" filter="url(#softBlur)"/>

  <!-- Name + tagline, centered, with generous breathing room -->
  <text x="750" y="248" text-anchor="middle" font-family="'Poppins','Segoe UI',sans-serif" font-size="73" font-weight="600" fill="url(#nameGrad)" letter-spacing="6">TANISHA VERMA</text>

  <line x1="668" y1="284" x2="832" y2="284" stroke="#7C3AED" stroke-opacity="0.45" stroke-width="1"/>

  <text x="750" y="313" text-anchor="middle" font-family="'Poppins','Segoe UI',sans-serif" font-size="14" font-weight="400" fill="#B9A3F0" letter-spacing="3" opacity="0.9">SOFTWARE ENGINEERING &#8226; AI / ML &#8226; FINTECH</text>
</svg>
